<!DOCTYPE html>
<html>
<head>
    <title>Live Poker Room</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background: #1a472a; color: white; font-family: sans-serif; text-align: center; }
        #table { border: 5px solid #5d3a1a; border-radius: 100px; padding: 50px; margin: 20px auto; width: 80%; background: #2e7d32; }
        .card { display: inline-block; background: white; color: black; padding: 10px; border-radius: 5px; margin: 5px; font-weight: bold; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #ffc107; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Poker Room: <span id="room-name">Main Table</span></h1>
    <div id="table">
        <h3>Community Cards</h3>
        <div id="community-cards"></div>
        <hr>
        <h3>Your Hand</h3>
        <div id="my-cards"></div>
    </div>

    <div class="controls">
        <button onclick="sendAction('check')">Check</button>
        <button onclick="sendAction('call')">Call</button>
        <button onclick="sendAction('fold')">Fold</button>
    </div>

    <div id="log" style="font-size: 0.8em; color: #ccc; margin-top: 20px;"></div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            socket.emit('join_table', {room: 'main_table'});
        });

        socket.on('player_joined', (data) => {
            document.getElementById('log').innerHTML += `<p>${data.username} joined the game.</p>`;
        });

        socket.on('deal_hand', (data) => {
            const container = document.getElementById('my-cards');
            container.innerHTML = '';
            data.cards.forEach(c => {
                container.innerHTML += `<div class="card">${c.rank} of ${c.suit}</div>`;
            });
        });

        socket.on('update_community', (data) => {
            const container = document.getElementById('community-cards');
            container.innerHTML = '';
            data.cards.forEach(c => {
                container.innerHTML += `<div class="card">${c.rank} of ${c.suit}</div>`;
            });
        });

        function sendAction(type) {
            socket.emit('player_action', {action: type});
        }
    </script>
</body>
</html>
